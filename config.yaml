seed: 42
questions_per_category: 100
samples_per_question: 1
temperature: 0.0
max_tokens: 1024
models:
  # `name` is the short label used in charts and tables.
  # Haiku 5.5. Run with: python -m src.run_eval --models haiku --limit 5
  # Key goes in .env as ANTHROPIC_API_KEY. Haiku 5.5 rejects temperature,
  # and adaptive thinking is on unless you set an effort level.
  - name: haiku
    provider: anthropic
    model_id: claude-haiku-5-5
    supports_temperature: false
  # Same model with adaptive thinking turned off, so replies are direct answers.
  # This is the run compared against Luna in the README.
  - name: haiku_nothink
    provider: anthropic
    model_id: claude-haiku-5-5
    supports_temperature: false
    thinking: disabled
  # OpenAI. Run with: python -m src.run_eval --models gpt_luna --limit 20
  # Key goes in .env as OPENAI_API_KEY. Do not commit that file.
  # sol and astra stay commented so a plain run cannot spend that money.
  - name: gpt_luna
    provider: openai
    model_id: gpt-6-luna
    supports_temperature: false  # Luna rejects temperature 0 and only allows the default
  # - name: gpt_sol
  #   provider: openai
  #   model_id: gpt-6.2-sol
  #   supports_temperature: true
  # - name: gpt_astra
  #   provider: openai
  #   model_id: gpt-6.2-astra
  #   supports_temperature: true
  - name: local             # free run on this Mac via Ollama
    provider: ollama
    model_id: llama3.2
    supports_temperature: true
  - name: mock
    provider: mock
    model_id: mock-sycophant
    supports_temperature: true
